{% extends "base.html" %}
{% block title %}新增分包采购单{% endblock %}
{% block page_title %}新增分包采购单{% endblock %}
{% block content %}

<div class="card" style="max-width:700px;">
  <div class="card-header"><i class="bi bi-cart-plus me-1"></i>新增分包采购单</div>
  <div class="card-body p-4">
    <form method="post" action="/subcontracts/orders/new">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">所属分包合同 *</label>
          <select name="subcontract_id" class="form-select" required>
            <option value="">请选择分包合同</option>
            {% for sc in subcontracts %}
            <option value="{{ sc.id }}" {{ 'selected' if prefill_subcontract_id == sc.id else '' }}>
              {{ sc.name }}（{{ sc.contract_no or '无编号' }}）· {{ sc.party_b or '' }} · ¥{{ sc.amount|money }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">单号</label>
          <input name="order_no" class="form-control" placeholder="如 FBO-2026-01">
        </div>
        <div class="col-md-6">
          <label class="form-label">金额 ¥</label>
          <input name="total_amount" type="number" step="0.01" class="form-control" value="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">日期</label>
          <input name="order_date" type="date" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">备注</label>
          <textarea name="note" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
        <a href="/subcontracts" class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
