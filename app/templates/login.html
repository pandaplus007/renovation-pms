<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ OPTIONS.company_name }}</title>
  <script>
    // 登录页固定浅色，但底色跟着设置页里选的「蓝底 / 冷纸白」走
    try {
      if (localStorage.getItem('pms-canvas') === 'paper') {
        document.documentElement.setAttribute('data-canvas', 'paper');
      }
    } catch (e) {}
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v={{ CSS_VERSION }}">
  <link rel="stylesheet" href="/static/css/basecamp.css?v={{ CSS_VERSION }}">
  <link rel="stylesheet" href="/static/css/linear.css?v={{ CSS_VERSION }}">
</head>
<body class="login-body">
<div class="login-card card shadow">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-house-gear-fill login-icon"></i>
      <h4 class="mt-2 mb-0">{% if OPTIONS.company_logo %}<img src="{{ OPTIONS.company_logo }}" class="brand-logo mb-1" alt="logo" style="height:34px">{% endif %}{{ OPTIONS.company_name }}</h4>
      <div class="text-muted small">客户 · 项目 · 成本 · 材料</div>
    </div>
    {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">登 录</button>
    </form>
  </div>
</div>
</body>
</html>
