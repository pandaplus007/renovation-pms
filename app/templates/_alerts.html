<!-- 提醒铃铛（可在页面中多处引入，使用 class 避免 id 冲突） -->
<div class="dropdown alerts-root">
  <button class="btn btn-sm position-relative" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="待办提醒">
    <i class="bi bi-bell"></i>
    <span class="alert-badge badge text-bg-danger rounded-pill position-absolute top-0 start-100 translate-middle d-none">0</span>
  </button>
  <ul class="alert-list dropdown-menu dropdown-menu-end shadow" style="width:360px;max-height:480px;overflow-y:auto;">
    <li class="dropdown-header fw-bold"><i class="bi bi-bell-fill me-1"></i>待办提醒</li>
    <li class="dropdown-item text-muted small">加载中...</li>
  </ul>
</div>

<script>
// 铃铛可能被同时引入两次（移动顶栏 + 桌面顶栏），用全局标记保证只发一次请求
(function () {
  if (window.__pmsAlertsBound) return;
  window.__pmsAlertsBound = true;

  function loadAlerts() {
    fetch('/api/alerts')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.querySelectorAll('.alert-badge').forEach(function (badge) {
          if (data.count > 0) {
            badge.textContent = data.count > 99 ? '99+' : data.count;
            badge.classList.remove('d-none');
          } else {
            badge.classList.add('d-none');
          }
        });
        var html = '<li class="dropdown-header fw-bold"><i class="bi bi-bell-fill me-1"></i>待办提醒</li>';
        if (data.items.length === 0) {
          html += '<li class="dropdown-item text-muted small">暂无待办提醒</li>';
        } else {
          data.items.forEach(function (item) {
            html += '<li><a class="dropdown-item d-flex align-items-start gap-2 py-2" href="' + item.url + '">'
              + '<span class="badge text-bg-' + item.badge + ' mt-1">' + item.type + '</span>'
              + '<span class="flex-grow-1 small">' + item.text
              + '<div class="text-muted" style="font-size:12px">' + item.date + '</div></span>'
              + '</a></li>';
          });
        }
        document.querySelectorAll('.alert-list').forEach(function (list) {
          list.innerHTML = html;
        });
      })
      .catch(function () { /* 未登录或网络异常时静默 */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadAlerts);
  } else {
    loadAlerts();
  }
})();
</script>
